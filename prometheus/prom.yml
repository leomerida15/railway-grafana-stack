global:
  scrape_interval: 15s # Default scrape interval

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # - job_name: 'example_api'
  #   scheme: http
  #   static_configs:
  #     - targets: ['example_api:9091']

  # ? TODO: add your services here
  # - job_name: 'your-job-name'
  #   scheme: https
  #   static_configs:
  #     - targets: ['URL_GOES_HERE']
  #   basic_auth:
  #     username: HTTP_AUTH_USERNAME_GOES_HERE
  #     password: HTTP_AUTH_PASSWORD_GOES_HERE

  # Flowise metrics — deployed via dedicated Prometheus-Flowise service
  - job_name: 'flowise'
    scrape_interval: 15s
    metrics_path: '/api/v1/metrics'
    scheme: https
    authorization:
      type: Bearer
      credentials_file: '/run/secrets/flowise_api_key'
    static_configs:
      - targets: ['flow-stable-flow.up.railway.app']
    tls_config:
      insecure_skip_verify: false